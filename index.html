<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUNNY</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  background: #050912;
  color: #eaf2ff;

  font-family: "Segoe UI", Arial, sans-serif;

  overflow: hidden;
}

/* ================================
   BACKGROUND
================================ */

body {
  background:
    radial-gradient(
      circle at 50% 35%,
      #102a50 0,
      #081323 30%,
      #050912 70%
    );
}

#background {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;

  pointer-events: none;

  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(35, 125, 255, 0.035) 50%,
      transparent 100%
    );
}

/* ================================
   HEADER
================================ */

#brand {
  position: relative;

  height: 68px;
  width: 100%;

  display: flex;
  align-items: center;

  padding-left: 32px;

  background: #070d18;

  border-bottom: 1px solid #18304f;
}

#brand img {
  width: 34px;
  height: 34px;

  margin-right: 12px;

  border-radius: 50%;

  box-shadow:
    0 0 0 1px #245487,
    0 0 18px rgba(35, 130, 255, 0.35);
}

#brand b {
  color: #f2f7ff;

  font-size: 18px;
  font-weight: 700;

  letter-spacing: 0.28em;
}

/* ================================
   MAIN AREA
================================ */

#wrap {
  position: relative;

  width: 900px;
  max-width: calc(100% - 60px);

  margin: 0 auto;

  padding-top: 70px;
}

/* ================================
   MAIN CARD
================================ */

#maincard {
  position: relative;

  min-height: 280px;

  padding: 42px;

  background: #0a1425;

  border: 1px solid #1b3b63;

  border-radius: 14px;

  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255,255,255,0.025);
}

#maincard::before {
  content: "";

  position: absolute;

  left: 0;
  top: 0;
  bottom: 0;

  width: 3px;

  background: #2388ff;

  box-shadow:
    0 0 15px rgba(35, 136, 255, 0.65);
}

/* ================================
   LABEL
================================ */

#label {
  margin-bottom: 12px;

  color: #4fa5ff;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: 0.22em;

  text-transform: uppercase;
}

/* ================================
   STATE
================================ */

#state {
  margin: 0;

  color: #f3f7ff;

  font-size: 38px;
  line-height: 1.15;

  font-weight: 700;

  letter-spacing: -0.02em;
}

/* ================================
   FIRMWARE DETAILS
================================ */

#det {
  margin-top: 18px;

  color: #73859f;

  font-size: 14px;
}

#det b {
  color: #8bc8ff;
  font-weight: 600;
}

/* ================================
   CACHE
================================ */

#cachebox {
  margin-top: 20px;

  padding: 15px 18px;

  background: #08111f;

  border: 1px solid #142d4b;

  border-radius: 8px;
}

#cachelabel {
  margin-bottom: 3px;

  color: #50637e;

  font-size: 9px;
  font-weight: 700;

  letter-spacing: 0.18em;

  text-transform: uppercase;
}

#cache {
  min-height: 18px;

  color: #60728b;

  font-size: 12px;
}

#cache.cacheok {
  color: #54dfa0;
}

/* ================================
   CONTROLLER HINT
================================ */

#hint {
  margin-top: 22px;

  text-align: right;

  color: #4e617c;

  font-size: 10px;
  font-weight: 600;

  letter-spacing: 0.15em;
}

#xbutton {
  display: inline-block;

  width: 24px;
  height: 24px;

  margin-right: 7px;

  text-align: center;
  line-height: 24px;

  border-radius: 50%;

  background: #126fe1;

  color: white;

  font-size: 12px;
  font-weight: 700;

  box-shadow:
    0 0 12px rgba(18, 111, 225, 0.4);
}

/* ================================
   STATES
================================ */

.ok {
  color: #54dfa0 !important;
}

.bad {
  color: #ff6278 !important;
}

.warn {
  color: #ffd166 !important;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

  #brand {
    padding-left: 20px;
  }

  #wrap {
    max-width: calc(100% - 28px);

    padding-top: 35px;
  }

  #maincard {
    padding: 28px;
  }

  #state {
    font-size: 29px;
  }

  #hint {
    text-align: center;
  }
}
</style>
</head>

<body>

<div id="background"></div>

<!-- ONLY HEADER -->
<div id="brand">
  <img
    src="bunny.png"
    alt=""
    width="34"
    height="34"
  >
  <b>BUNNY</b>
</div>

<div id="wrap">

  <div id="maincard">

    <div id="label">
      PS4 SYSTEM
    </div>

    <div id="state">
      detecting firmware...
    </div>

    <div id="det"></div>

    <div id="cachebox">

      <div id="cachelabel">
        Offline Environment
      </div>

      <div id="cache"></div>

    </div>

  </div>

  <div id="hint">
    <span id="xbutton">X</span>
    PRESS X OR TAP TO CONTINUE
  </div>

</div>

<script>
(function () {

    var stateEl =
        document.getElementById("state");

    var detEl =
        document.getElementById("det");

    var cacheEl =
        document.getElementById("cache");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className =
            ok ? "cacheok" : "";
    }

    var params =
        new URLSearchParams(location.search);

    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };

    var key = null;
    var fwnum = null;

    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(navigator.userAgent);

    if (m) {

        var ms =
            parseInt(m[2], 16)
            .toString(16);

        if (ms.length < 2) {
            ms = "0" + ms;
        }

        key =
            m[1] +
            "." +
            ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var forced =
        params.get("force") === "1";

    var supported =
        forced ||
        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );

    detEl.innerHTML =
        "Firmware <b>" +
        (key || "unknown") +
        "</b>" +
        (
            supported
                ? " &middot; <b>supported</b>"
                : " &middot; not in this build's kernel table"
        );

    var target =
        "jb.html" + location.search;

    function go() {

        setState(
            "loading jailbreak...",
            "warn"
        );

        location.replace(target);
    }

    function waitForTap(msg, action) {

        setState(msg, "warn");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    if (!supported) {

        setState(
            "UNSUPPORTED FIRMWARE",
            "bad"
        );

        waitForTap(
            "UNSUPPORTED (" +
            (key || "unknown") +
            ") — PRESS X OR TAP TO RUN ANYWAY",
            go
        );

        return;
    }

    var ac =
        window.applicationCache;

    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        setCache(
            "offline — from cache",
            true
        );

        go();

    } else if (
        ac.status === ac.IDLE
    ) {

        setCache(
            "cached",
            true
        );

        go();

    } else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {
            ac.swapCache();
        } catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        waitForTap(
            "UPDATE READY — PRESS X OR TAP TO RELOAD",
            function () {
                location.reload();
            }
        );

    } else {

        setCache(
            "checking cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {
                setCache(
                    "caching for offline..."
                );
            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    setCache(
                        "caching " +
                        Math.round(
                            (e.loaded / e.total) *
                            100
                        ) +
                        "%"
                    );
                }
            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                waitForTap(
                    "CACHED — PRESS X OR TAP TO RUN",
                    go
                );
            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                waitForTap(
                    "UPDATE READY — PRESS X OR TAP TO RELOAD",
                    function () {
                        location.reload();
                    }
                );
            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "cached — offline ready",
                    true
                );

                go();
            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED — PRESS X OR TAP TO RUN ANYWAY",
                    go
                );
            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE — PRESS X OR TAP TO RUN",
                    go
                );
            },
            false
        );
    }

})();
</script>

</body>
</html>
