<!doctype html>
<html lang="en" manifest="cache.appcache">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>BUNNY</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #050912;

  color: #edf5ff;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  overflow: hidden;
}

/* =================================
   HEADER
================================= */

#brand {
  position: relative;

  width: 100%;
  height: 68px;

  display: flex;
  align-items: center;

  padding-left: 32px;

  background: #070d18;

  border-bottom:
    1px solid #18304f;
}

#brand img {
  width: 34px;
  height: 34px;

  margin-right: 12px;

  border-radius: 50%;

  box-shadow:
    0 0 0 1px #245487,
    0 0 18px rgba(35, 130, 255, .35);
}

#brand b {
  color: #f2f7ff;

  font-size: 18px;
  font-weight: 700;

  letter-spacing: .28em;
}

/* =================================
   EXECUTION SCREEN
================================= */

#execution {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 500px;
  max-width: calc(100% - 40px);

  transform:
    translate(-50%, -50%);

  text-align: center;
}

/* =================================
   LOADER
================================= */

#loader {
  position: relative;

  width: 120px;
  height: 120px;

  margin: 0 auto 28px;
}

#loader-ring {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 72px;
  height: 72px;

  margin:
    -36px 0 0 -36px;

  border:
    3px solid #102642;

  border-top-color: #38a4ff;

  border-radius: 50%;

  animation:
    spin .85s linear infinite;

  box-shadow:
    0 0 25px rgba(35, 136, 255, .25);
}

#loader-core {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 12px;
  height: 12px;

  margin:
    -6px 0 0 -6px;

  border-radius: 50%;

  background: #58bdff;

  box-shadow:
    0 0 18px #238dff;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =================================
   MESSAGE
================================= */

#msg {
  display: none;

  color: #9cb0c9;

  font-size: 17px;
  font-weight: 600;

  letter-spacing: .13em;

  text-transform: uppercase;
}

#submsg {
  margin-top: 9px;

  color: #4f627c;

  font-size: 11px;

  letter-spacing: .16em;

  text-transform: uppercase;
}

/* =================================
   COMPLETED
================================= */

body.done #loader {
  display: none;
}

body.done #msg {
  display: block;

  color: #4de3a1;

  text-shadow:
    0 0 18px rgba(77, 227, 161, .22);
}

body.done #submsg {
  display: none;
}

/* =================================
   FAILED
================================= */

body.fail #loader {
  display: none;
}

body.fail #msg {
  display: block;

  color: #ff6076;

  text-shadow:
    0 0 18px rgba(255, 96, 118, .22);
}

body.fail #submsg {
  display: none;
}

/* =================================
   ORIGINAL JB.JS ELEMENTS
================================= */

#spin {
  display: none;
}

#wrap {
  display: none;
}

#state,
#out {
  display: none;
}

/* =================================
   LOG MODE
================================= */

body.log #execution {
  display: none;
}

body.log #brand {
  display: flex;
}

body.log #wrap {
  display: block;

  width: 900px;
  max-width: calc(100% - 50px);

  margin: 0 auto;

  padding-top: 35px;
}

body.log #state {
  display: block;

  margin-bottom: 14px;

  color: #edf5ff;

  font-size: 24px;
  font-weight: 700;
}

body.log #out {
  display: block;

  height:
    calc(100vh - 145px);

  padding: 18px;

  overflow-y: auto;

  background: #07101d;

  border:
    1px solid #193756;

  border-radius: 10px;

  color: #9fb2ca;

  font:
    13px/1.55
    Consolas,
    monospace;

  white-space: pre-wrap;
}

body.log #out::-webkit-scrollbar {
  width: 7px;
}

body.log #out::-webkit-scrollbar-thumb {
  background: #1d5e9e;
  border-radius: 8px;
}

body.log #out::-webkit-scrollbar-track {
  background: #050a12;
}

/* =================================
   JB.JS COLORS
================================= */

.ok,
.safe {
  color: #4de3a1;
}

.bad,
.danger {
  color: #ff6076;
}

.warn {
  color: #ffd166;
}

code {
  color: #62baff;
}

/* =================================
   SMALL SCREEN
================================= */

@media (max-width: 600px) {

  #brand {
    padding-left: 20px;
  }

  #execution {
    width: calc(100% - 30px);
  }

  body.log #wrap {
    width: calc(100% - 28px);
  }

}

</style>
</head>

<body>

<!-- ONLY ONE HEADER -->
<div id="brand">

  <img
    src="bunny.png"
    alt=""
    width="34"
    height="34"
  >

  <b>BUNNY</b>

</div>

<!-- VISUAL EXECUTION UI -->
<div id="execution">

  <div id="loader">

    <div id="loader-ring"></div>
    <div id="loader-core"></div>

  </div>

  <div id="msg">
    Restart your console
  </div>

  <div id="submsg">
    Initializing system environment
  </div>

</div>

<!-- ELEMENTS REQUIRED BY JB.JS -->
<div id="spin"></div>

<div id="wrap">

  <div id="state"></div>

  <div id="out"></div>

</div>

<script type="module">
  import "./jb.js?v=19";
</script>

</body>
</html>
